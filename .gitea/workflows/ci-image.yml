name: CI Image

# Builds the production tessara-server image (deployment/Dockerfile) and pushes it to Zot for
# k3s to pull. Unlike deployment/Dockerfile.dev (SQLite, built from local workspace source), this
# resolves tessara-core from devpi — UV_INDEX_URL below must point at an index that actually has
# a tessara-core release published to it (uploaded manually today; see manager repo's
# docs/planning/build-pipeline.md devpi notes). If devpi ever locks down anonymous reads, add a
# DEVPI_USERNAME/DEVPI_PASSWORD-authenticated URL here instead.
on:
  push:
    branches: [main]
    paths:
      - apps/tessara-server/**
      - packages/tessara-core/**
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    container:
      image: docker:git
    steps:
      - name: Install Node.js
        run: apk add --no-cache nodejs

      - uses: actions/checkout@v4

      - name: Log in to Zot push registry
        env:
          # actrunner — not a secret, the dedicated LLDAP automation account name (scoped to
          # ci/** create/read/update, see roles/kita/templates/configuration/zot/config.json.j2
          # in the manager repo). Only its password is a real secret.
          ZOT_USERNAME: actrunner
        run: |
          echo "${{ secrets.ZOT_PASSWORD }}" | \
            docker login zot.florence.place \
              --username "${ZOT_USERNAME}" \
              --password-stdin

      - name: Build and push tessara-server image
        env:
          UV_INDEX_URL: https://devpi.florence.place/mc962/dev/+simple/
        run: |
          IMAGE="zot.florence.place/ci/tessara-server"
          TAG="${GITHUB_SHA::12}"
          # --push (not a separate `docker push`): this runner's docker CLI defaults to buildx's
          # docker-container driver, which builds into an isolated builder and never lands the
          # image in the local image store — a bare `docker build -t ...` leaves nothing for a
          # follow-up `docker push` to find ("image not known"), confirmed via a real failed run
          # on the mimir ci-base workflow. --push builds straight to the registry in one step.
          docker build \
            --build-arg UV_INDEX_URL="${UV_INDEX_URL}" \
            -f apps/tessara-server/deployment/Dockerfile \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            --push \
            apps/tessara-server/

      - name: Log out of registry
        if: always()
        run: docker logout zot.florence.place
