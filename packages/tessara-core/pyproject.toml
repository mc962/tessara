[project]
name = "tessara"
version = "0.1.0"
description = "Core brand asset generation logic for tessara (no CLI/web framework dependencies)."
requires-python = ">=3.13"
dependencies = [
    "pillow>=11.0",
    "cairosvg>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessara"]
