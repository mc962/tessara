[project]
name = "tessara-cli"
version = "0.1.0"
description = "Command-line interface for tessara."
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "aiohttp>=3.13.5",
]

[project.optional-dependencies]
local = ["tessara>=0.1.0,<0.2"]

[project.scripts]
tessara = "tessara_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessara_cli"]

[tool.uv.sources]
tessara = { workspace = true }
