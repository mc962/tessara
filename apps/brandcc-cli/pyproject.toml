[project]
name = "brandcc-cli"
version = "0.1.0"
description = "Command-line interface for brandcc."
requires-python = ">=3.13"
dependencies = [
    "brandcc-core",
    "typer>=0.12",
]

[project.scripts]
brandcc = "brandcc_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brandcc_cli"]

[tool.uv.sources]
brandcc-core = { workspace = true }
