# DEVELOPMENT stack — builds tessera-core from local source via the uv
# workspace, SQLite. See docker-compose.yml for production (Postgres,
# published tessera-core).
#
# Run from this directory with:
#   docker compose -f docker-compose.dev.yml up --build

services:
  tessera-server:
    build:
      context: ../../..
      dockerfile: apps/tessera-server/deployment/Dockerfile.dev
    container_name: tessera-server-dev
    environment:
      APP_ENV: lcl
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE__KIND: sqlite
      DATABASE__PATH: /data/tessera.db
      # Required — gunicorn will still start without it, but sessions won't
      # survive a restart. Generate one with: python3 -c "import secrets; print(secrets.token_hex(32))"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      # Set this to your reverse proxy's IP if tessera-server sits behind one
      # (nginx, Caddy, Traefik, ...); leave empty for a direct port mapping.
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-}
    ports:
      - "${TESSERA_PORT:-8123}:8000"
    volumes:
      - tessera_data:/data
    restart: unless-stopped

volumes:
  tessera_data:
