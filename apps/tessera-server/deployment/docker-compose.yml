# PRODUCTION stack — installs tessera-core as a published dependency
# (deployment/Dockerfile), Postgres. Doesn't build until tessera-core is
# actually published somewhere reachable by UV_INDEX_URL — see
# docker-compose.dev.yml for a stack that works today.
#
# Run from this directory with:
#   docker compose up --build -d

services:
  tessera-server:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    container_name: tessera-server
    environment:
      APP_ENV: prd
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE__KIND: postgres
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      DATABASE__USER: tessera
      DATABASE__PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE__DATABASE: tessera
      # Required — gunicorn will still start without it, but sessions won't
      # survive a restart. Generate one with: python3 -c "import secrets; print(secrets.token_hex(32))"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      # Set this to your reverse proxy's IP if tessera-server sits behind one
      # (nginx, Caddy, Traefik, ...); leave empty for a direct port mapping.
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${TESSERA_PORT:-8123}:8000"
    restart: unless-stopped

  db:
    image: postgres:18
    container_name: tessera-db
    environment:
      POSTGRES_DB: tessera
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - tessera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  tessera_pgdata:
