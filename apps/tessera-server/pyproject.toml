[project]
name = "tessera-server"
version = "0.1.0"
description = "FastAPI server for tessera asset generation."
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "tessera-core",
    "fastapi[standard]>=0.139.2",
    "gunicorn>=23.0.0",
    "itsdangerous>=2.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.50",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.51",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.22.0"]
postgres = ["asyncpg>=0.31.0"]
all-databases = ["aiosqlite>=0.22.0", "asyncpg>=0.31.0"]
metrics = ["prometheus-client>=0.21.0"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.1.0",
    "pip-audit>=2.10.0",
    "ruff>=0.15.14",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
tessera-server = "tessera_server.main:run"
tessera-server-admin = "tessera_server.cli:main"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = ["tests/", "src/tessera_server/data/database/migration/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera_server"]

[tool.uv.sources]
tessera-core = { workspace = true }
