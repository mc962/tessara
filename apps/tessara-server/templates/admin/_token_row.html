<tr id="token-row-{{ token.id }}">
    <td>{{ token.name }}</td>
    <td><code>{{ token.token_prefix }}…</code></td>
    <td>
        {% if token.is_active %}
            <span class="badge badge-ok">active</span>
        {% else %}
            <span class="badge badge-warn">disabled</span>
        {% endif %}
    </td>
    <td>{{ token.last_used_at.strftime("%Y-%m-%d %H:%M") if token.last_used_at else "—" }}</td>
    <td>{{ token.created_at.strftime("%Y-%m-%d") }}</td>
    <td class="row-actions">
        <button
            hx-post="/admin/users/{{ token.user_id }}/tokens/{{ token.id }}/toggle"
            hx-target="#token-row-{{ token.id }}"
            hx-swap="outerHTML"
        >{{ "Disable" if token.is_active else "Enable" }}</button>
        <button
            class="btn-danger"
            hx-post="/admin/users/{{ token.user_id }}/tokens/{{ token.id }}/delete"
            hx-target="#token-row-{{ token.id }}"
            hx-swap="outerHTML swap:0.15s"
            hx-confirm="Delete token {{ token.name }}?"
        >Delete</button>
    </td>
</tr>
