<tr id="key-row-{{ key.id }}">
    <td>{{ key.name }}</td>
    <td><code>{{ key.key_prefix }}…</code></td>
    <td>
        {% if key.is_superuser %}
            <span class="badge badge-ok">yes</span>
        {% else %}
            <span class="muted">—</span>
        {% endif %}
    </td>
    <td>
        {% if key.is_active %}
            <span class="badge badge-ok">active</span>
        {% else %}
            <span class="badge badge-warn">disabled</span>
        {% endif %}
    </td>
    <td>{{ key.last_used_at.strftime("%Y-%m-%d %H:%M") if key.last_used_at else "—" }}</td>
    <td>{{ key.created_at.strftime("%Y-%m-%d") }}</td>
    <td class="row-actions">
        <button
            hx-post="/admin/api-keys/{{ key.id }}/toggle"
            hx-target="#key-row-{{ key.id }}"
            hx-swap="outerHTML"
        >{{ "Disable" if key.is_active else "Enable" }}</button>
        <button
            class="btn-danger"
            hx-post="/admin/api-keys/{{ key.id }}/delete"
            hx-target="#key-row-{{ key.id }}"
            hx-swap="outerHTML swap:0.15s"
            hx-confirm="Delete key {{ key.name }}?"
        >Delete</button>
    </td>
</tr>
