{% extends "base.html" %}
{% block title %}Login — {{ settings.project_name }}{% endblock %}

{% block content %}
<div class="auth-box">
    <h2>Sign in</h2>
    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login">
        <input type="hidden" name="next" value="{{ next or '' }}">
        <label for="api_key">API Key</label>
        <input type="password" id="api_key" name="api_key" placeholder="tsa_..." required autofocus>
        <p class="field-hint">A superuser key is only needed for API key management.</p>
        <button type="submit">Sign in</button>
    </form>
</div>
{% endblock %}
