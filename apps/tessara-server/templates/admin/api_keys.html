{% extends "base.html" %}
{% block title %}API Keys — {{ settings.project_name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h2>API Keys</h2>
    <form method="post" action="/admin/logout">
        <button type="submit" class="btn-link">Sign out</button>
    </form>
</div>

<div id="new-key-banner"></div>

<section class="card">
    <h3>Create key</h3>
    <form
        class="inline-form"
        hx-post="/admin/api-keys"
        hx-target="#keys-tbody"
        hx-swap="afterbegin"
        hx-on::after-request="if(event.detail.successful) this.reset()"
    >
        <input type="text" name="name" placeholder="Key name" required>
        <label class="checkbox-label">
            <input type="checkbox" name="is_superuser"> Superuser
        </label>
        <button type="submit" class="btn-primary">
            Create
            <span class="htmx-indicator">…</span>
        </button>
    </form>
</section>

<section class="card">
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Prefix</th>
                <th>Superuser</th>
                <th>Active</th>
                <th>Last used</th>
                <th>Created</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="keys-tbody">
            {% for key in keys %}
                {% include "admin/_key_row.html" %}
            {% else %}
            <tr id="empty-row"><td colspan="7" class="muted">No keys yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
