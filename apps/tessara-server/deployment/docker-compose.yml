# PRODUCTION stack — installs tessara-core as a published dependency
# (deployment/Dockerfile), Postgres. Doesn't build until tessara-core is
# actually published somewhere reachable by UV_INDEX_URL — see
# docker-compose.dev.yml for a stack that works today.
#
# Run from this directory with:
#   docker compose up --build -d

services:
  tessara-server:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    container_name: tessara-server
    environment:
      APP_ENV: prd
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE__KIND: postgres
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      DATABASE__USER: tessara
      DATABASE__PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE__DATABASE: tessara
      # Required — gunicorn will still start without it, but sessions won't
      # survive a restart. Generate one with: python3 -c "import secrets; print(secrets.token_hex(32))"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      # Set this to your reverse proxy's IP if tessara-server sits behind one
      # (nginx, Caddy, Traefik, ...); leave empty for a direct port mapping.
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-}
      # Absolute URL this instance is reachable at — embedded in
      # verification/password-reset email links.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8123}
      # SMTP — leave SMTP_HOST unset to log verification/reset links instead
      # of emailing them (`docker compose logs`); fine for a closed
      # homelab deployment, not for open self-service signups.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-noreply@example.com}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${TESSARA_PORT:-8123}:8000"
    restart: unless-stopped

  db:
    image: postgres:18
    container_name: tessara-db
    environment:
      POSTGRES_DB: tessara
      POSTGRES_USER: tessara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - tessara_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessara"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  tessara_pgdata:
