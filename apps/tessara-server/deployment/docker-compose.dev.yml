# DEVELOPMENT stack — builds tessara-core from local source via the uv
# workspace, SQLite. See docker-compose.yml for production (Postgres,
# published tessara-core).
#
# Run from this directory with:
#   docker compose -f docker-compose.dev.yml up --build

services:
  tessara-server:
    build:
      context: ../../..
      dockerfile: apps/tessara-server/deployment/Dockerfile.dev
    container_name: tessara-server-dev
    environment:
      APP_ENV: lcl
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE__KIND: sqlite
      DATABASE__PATH: /data/tessara.db
      # Required — gunicorn will still start without it, but sessions won't
      # survive a restart. Generate one with: python3 -c "import secrets; print(secrets.token_hex(32))"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      # Set this to your reverse proxy's IP if tessara-server sits behind one
      # (nginx, Caddy, Traefik, ...); leave empty for a direct port mapping.
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-}
      # Absolute URL this instance is reachable at — embedded in
      # verification/password-reset email links.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8123}
      # SMTP — leave SMTP_HOST unset to log verification/reset links instead
      # of emailing them (`docker compose logs`).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-noreply@example.com}
    ports:
      - "${TESSARA_PORT:-8123}:8000"
    volumes:
      - tessara_data:/data
    restart: unless-stopped

volumes:
  tessara_data:
