[project]
name = "tessera-cli"
version = "0.1.0"
description = "Command-line interface for tessera."
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "aiohttp>=3.13.5",
]

[project.optional-dependencies]
local = ["tessera-core>=0.1.0,<0.2"]

[project.scripts]
tessera = "tessera_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera_cli"]

[tool.uv.sources]
tessera-core = { workspace = true }
