{% extends "base.html" %}
{% block title %}Login — {{ settings.project_name }}{% endblock %}

{% block content %}
<div class="auth-box">
    <h2>Admin Login</h2>
    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login">
        <label for="api_key">Superuser API Key</label>
        <input type="password" id="api_key" name="api_key" placeholder="bcc_..." required autofocus>
        <button type="submit">Sign in</button>
    </form>
</div>
{% endblock %}
